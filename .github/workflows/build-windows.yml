name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag that receives the installer (created automatically if missing)
        required: true
        default: v0.1.3-alpha.2
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # This is intentionally explicit: releases require a certificate unless
      # this opt-in is present. The published installer will show SmartScreen
      # warnings until a Windows code-signing certificate is configured.
      DSH_DESKTOP_ALLOW_UNSIGNED_WINDOWS: '1'
      DSH_DESKTOP_APP_ID: ai.deepseek.harness.desktop
      DSH_DESKTOP_TARGET_PLATFORM: win32
      DSH_DESKTOP_TARGET_ARCH: x64
      DOWNLOAD_TEST_ORIGIN: https://github.com

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Check out the pinned official Harness baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: c389f96bf3a9b6807cb71ed6bdad5849be0df6d8
          path: source

      - name: Apply Desktop customisation patch
        shell: pwsh
        run: |
          Expand-Archive -Path patches/desktop-customizations.patch.zip -DestinationPath unpacked
          $patch = Get-ChildItem unpacked -Recurse -File -Filter '*.patch' |
            Where-Object { -not $_.Name.StartsWith('._') } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($patch)) { throw 'Desktop customisation patch was not found after extraction.' }
          git -C source apply --check --binary $patch
          git -C source apply --binary $patch
          $primaryCfg = "source/packages/desktop/primary-mode/tsconfig.json"
          if (Test-Path $primaryCfg) {
            $cfg = Get-Content $primaryCfg -Raw | ConvertFrom-Json
            $cfg.references = @(@{ path = "../../../vendor/cordis" })
            $cfg | ConvertTo-Json -Depth 5 | Set-Content $primaryCfg -Encoding utf8
          }
          $clientCfg = "source/tsconfig.client.json"
          if (Test-Path $clientCfg) {
            $cfg = Get-Content $clientCfg -Raw | ConvertFrom-Json
            $desktopRefs = @(
              @{ path = "./packages/desktop/primary-mode/tsconfig.json" },
              @{ path = "./packages/desktop/primary-mode/tsconfig.client.json" },
              @{ path = "./packages/desktop/puppy-theme/tsconfig.json" },
              @{ path = "./packages/desktop/puppy-theme/tsconfig.client.json" },
              @{ path = "./packages/desktop/code-workspace/tsconfig.json" },
              @{ path = "./packages/desktop/code-workspace/tsconfig.client.json" },
              @{ path = "./packages/desktop/code-insights/tsconfig.json" },
              @{ path = "./packages/desktop/code-insights/tsconfig.client.json" }
            )
            $filtered = @()
            foreach ($r in $cfg.references) {
              if ($r.path -notmatch 'packages/desktop') {
                $filtered += $r
              }
            }
            $webIdx = -1
            for ($i = 0; $i -lt $filtered.Count; $i++) {
              if ($filtered[$i].path -eq './apps/web') {
                $webIdx = $i
                break
              }
            }
            if ($webIdx -ge 0) {
              $cfg.references = @($filtered[0..($webIdx - 1)]) + $desktopRefs + @($filtered[$webIdx..($filtered.Count - 1)])
            } else {
              $cfg.references = $filtered + $desktopRefs
            }
            $cfg | ConvertTo-Json -Depth 10 | Set-Content $clientCfg -Encoding utf8
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      # A source checkout deliberately does not contain generated Typert Remote
      # contracts under package lib/ directories. Build host libraries and run
      # tsdown host pass once to emit the model-driven Remote contracts, and
      # pre-compile the Desktop host package index entries so tsdown finds lib/types/index.js.
      - name: Bootstrap generated Remote contracts
        working-directory: source
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json
          pnpm run build:lib:host
          pnpm exec tsc -b packages/desktop/primary-mode/tsconfig.json packages/desktop/puppy-theme/tsconfig.json packages/desktop/code-workspace/tsconfig.json packages/desktop/code-insights/tsconfig.json

      - name: Package unsigned Windows x64 installer
        working-directory: source
        run: pnpm run package:desktop:win:x64

      - name: Validate installer presence
        shell: pwsh
        run: |
          $installer = Get-ChildItem source -Recurse -Filter *.exe |
            Where-Object { $_.Name -notmatch '__uninstaller' -and $_.DirectoryName -notmatch 'win-unpacked' -and $_.DirectoryName -match 'artifacts' } |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced.' }
          Write-Host "Found Windows installer: $($installer.FullName)"
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload installer to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-win-x64
          path: |
            source/apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe
            !source/apps/desktop/.desktop-build/targets/win-x64/artifacts/*__uninstaller.exe

      - name: Upload installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem source -Recurse -Filter *.exe |
            Where-Object { $_.Name -notmatch '__uninstaller' -and $_.DirectoryName -notmatch 'win-unpacked' -and $_.DirectoryName -match 'artifacts' } |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer not found for release upload.' }
          $tag = "${{ inputs.release_tag }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag does not exist yet. Creating release..."
            gh release create $tag "$($installer.FullName)#DeepSeek-Harness-win-x64.exe" --title "DeepSeek Harness Desktop $tag" --notes "DeepSeek Harness Desktop Windows x64 release installer."
          } else {
            Write-Host "Release $tag found. Uploading asset..."
            gh release upload $tag "$($installer.FullName)#DeepSeek-Harness-win-x64.exe" --clobber
          }
